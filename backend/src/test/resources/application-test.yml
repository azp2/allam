spring:
  datasource:
    url: jdbc:h2:mem:journal;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
journal:
  workers-enabled: false
  bootstrap-email: ""
  bootstrap-password: ""
  storage: ${java.io.tmpdir}/allam-journal-tests
  analytics-salt: test-only-analytics-salt
  oai-token-secret: test-only-oai-secret
