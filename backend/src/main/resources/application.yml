spring:
  application:
    name: allam-journal
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/journal?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USER:journal}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_TLS:false}
server:
  error:
    include-message: never
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:true}
management:
  endpoints:
    web:
      exposure:
        include: health
journal:
  base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  name: ${JOURNAL_NAME:Allam Journal}
  email: ${JOURNAL_EMAIL:editor@example.org}
  storage: ${STORAGE_PATH:./var/files}
  bootstrap-email: ${BOOTSTRAP_EMAIL:}
  bootstrap-password: ${BOOTSTRAP_PASSWORD:}
  workers-enabled: ${WORKERS_ENABLED:true}
  doi:
    provider: ${DOI_PROVIDER:none}
    prefix: ${DOI_PREFIX:}
    username: ${DOI_USER:}
    password: ${DOI_PASSWORD:}
    datacite-url: ${DATACITE_URL:https://api.test.datacite.org}
  orcid:
    client-id: ${ORCID_CLIENT_ID:}
    client-secret: ${ORCID_CLIENT_SECRET:}
    base-url: ${ORCID_BASE_URL:https://sandbox.orcid.org}
    redirect-uri: ${ORCID_REDIRECT_URI:http://localhost:8080/api/me/orcid/callback}
  oai-token-secret: ${OAI_TOKEN_SECRET:}
  analytics-salt: ${ANALYTICS_SALT:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    url: /openapi.json
    disable-swagger-default-url: true
    validator-url: ""
    display-request-duration: true
    operations-sorter: alpha
    tags-sorter: alpha
