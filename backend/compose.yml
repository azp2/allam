services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: journal
      MYSQL_USER: journal
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    ports: ["127.0.0.1:3306:3306"]
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      retries: 30
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:8025:8025"]
  api:
    build: .
    ports: ["127.0.0.1:8080:8080"]
    environment:
      DB_URL: jdbc:mysql://mysql:3306/journal?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      DB_USER: journal
      DB_PASSWORD: ${DB_PASSWORD}
      BOOTSTRAP_EMAIL: ${BOOTSTRAP_EMAIL}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD}
      COOKIE_SECURE: "false"
      SMTP_HOST: mailpit
      ANALYTICS_SALT: ${ANALYTICS_SALT}
    volumes: ["files:/app/var/files"]
    depends_on:
      mysql: {condition: service_healthy}
      mailpit: {condition: service_started}
volumes:
  mysql-data:
  files:
